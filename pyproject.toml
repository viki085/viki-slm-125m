[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viki-slm-125m"
version = "0.5.0"
description = "A 125M-parameter Python and SQL coding model (Llama-style decoder, trained from scratch)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["torch", "transformers>=4.46", "tokenizers", "safetensors", "sqlglot>=25", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
cloud = ["modal>=1.0", "datasets", "huggingface_hub>=0.34", "pyarrow>=17", "langdetect", "datasketch", "boto3"]

[tool.setuptools.packages.find]
include = ["viki_slm_125m*"]

[tool.setuptools.package-data]
viki_slm_125m = ["app/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
